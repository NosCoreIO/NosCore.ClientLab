<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ClientLab · Packet logger</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10171d;color:#dce9ef;font:14px system-ui}header{position:sticky;top:0;z-index:1;padding:18px 20px;background:#19262f;border-bottom:1px solid #38505e}h1{font-size:20px;margin:0 0 12px}label{margin-right:16px}input[type=search]{padding:8px;background:#10171d;border:1px solid #38505e;color:inherit;border-radius:6px}p{color:#9eb7c4;overflow-wrap:anywhere;margin:10px 0 0}#packets{padding:12px;outline:none;font:13px/1.65 Consolas,monospace}.packet{white-space:pre-wrap;overflow-wrap:anywhere;padding:3px 8px;border-radius:4px;cursor:default}.packet:hover{background:#1b2b35}.packet[aria-selected=true]{background:#264955;color:#fff}.time{color:#9db5c3}.direction{color:#b9e9d7}.receive .direction{color:#b4ccfa}button{padding:8px 12px;border:1px solid #526a78;background:#243a45;color:#f1f7fa;border-radius:6px;cursor:pointer}button:hover{background:#345464}button:focus-visible{outline:2px solid #b9e9d7;outline-offset:2px}#context-menu{position:fixed;z-index:10;min-width:235px;padding:6px;background:#21333e;border:1px solid #7895a5;border-radius:9px;box-shadow:0 8px 28px #0009}#context-menu[hidden]{display:none}#context-menu button{display:block;text-align:left;width:100%;background:transparent;border:0;color:#f1f7fa;padding:10px 12px;border-radius:4px;font:14px system-ui}#context-menu button:hover,#context-menu button:focus{background:#3c6173;outline:none}#context-menu button:disabled{color:#a0b2bd;cursor:default}#context-menu hr{border:0;border-top:1px solid #526a78;margin:5px 4px}
</style>
<header><h1>Packet logger</h1><label><input id="send" type="checkbox" checked>Send</label><label><input id="recv" type="checkbox" checked>Receive</label><input id="filter" type="search" placeholder="Filter packets" aria-label="Filter packets"> <button id="copy-visible">Copy visible packets</button> <button id="clear">Clear view</button><p id="file">Connecting…</p><p id="status" role="status"></p><p>Click to select a packet. Ctrl/⌘-click adds to the selection. Right-click for copy options.</p></header>
<div id="packets" role="listbox" aria-label="Captured packets" aria-multiselectable="true" tabindex="0"></div>
<div id="context-menu" role="menu" aria-label="Packet actions" hidden><button id="copy-packet" role="menuitem">Copy packet</button><button id="copy-raw" role="menuitem">Copy raw text</button><button id="copy-selection" role="menuitem">Copy selected text</button><hr><button id="copy-all" role="menuitem">Copy visible packets</button><button id="select-all" role="menuitem">Select all visible packets</button><hr><button id="clear-menu" role="menuitem">Clear view</button></div>
<script>
const $=id=>document.getElementById(id);let cursor=0,rows=[],visible=[],selected=new Set(),selectionText='';
const menu=$('context-menu'),list=$('packets');
const nodes=new Map();let renderedSelection=new Set(),filterText='',sendVisible=true,receiveVisible=true;
const stamp=e=>e.Timestamp.slice(11,23);
const tagged=e=>`[${stamp(e)}] [${e.Connection}] [${e.Direction==='Send'?'Client':'Server'}] ${e.Raw}`;
function closeMenu(){menu.hidden=true;}
function selection(){
 for(const id of renderedSelection)if(!selected.has(id))nodes.get(id)?.setAttribute('aria-selected','false');
 for(const id of selected)if(!renderedSelection.has(id))nodes.get(id)?.setAttribute('aria-selected','true');
 renderedSelection=new Set(selected);
}
function matches(e){return(e.Direction==='Send'?sendVisible:receiveVisible)&&(!filterText||e.Raw.toLowerCase().includes(filterText));}
function makeNode(e){
 const node=document.createElement('div');node.className='packet'+(e.Direction==='Receive'?' receive':'');node.dataset.id=e.Id;node.setAttribute('role','option');node.setAttribute('aria-selected',selected.has(e.Id));node.title=e.Timestamp;
 const time=document.createElement('span');time.className='time';time.textContent=`[${stamp(e)}] `;const tag=document.createElement('span');tag.className='direction';tag.textContent=`[${e.Connection}] [${e.Direction==='Send'?'Client':'Server'}] `;
 node.append(time,tag,document.createTextNode(e.Raw+'\n'));nodes.set(e.Id,node);return node;
}
function render(){
 filterText=$('filter').value.toLowerCase();sendVisible=$('send').checked;receiveVisible=$('recv').checked;visible=rows.filter(matches);
 const ids=new Set(visible.map(e=>e.Id));for(const[id,node]of nodes)if(!ids.has(id)){node.remove();nodes.delete(id);}
 let position=list.firstChild;
 for(const e of visible){const node=nodes.get(e.Id)||makeNode(e);if(node===position)position=position.nextSibling;else list.insertBefore(node,position);}
 const retained=new Set(rows.map(e=>e.Id));selected=new Set([...selected].filter(id=>retained.has(id)));selection();
}
function append(entries){
 rows.push(...entries);
 const removed=rows.splice(0,Math.max(0,rows.length-10000));
 for(const e of removed){nodes.get(e.Id)?.remove();nodes.delete(e.Id);selected.delete(e.Id);renderedSelection.delete(e.Id);}
 if(removed.length){const last=removed.at(-1).Id;let count=0;while(count<visible.length&&visible[count].Id<=last)count++;visible.splice(0,count);}
 const retained=rows.length?rows[0].Id:Infinity,fragment=document.createDocumentFragment();
 for(const e of entries)if(e.Id>=retained&&matches(e)){visible.push(e);fragment.append(makeNode(e));}
 list.append(fragment);
}
for(const id of ['send','recv','filter'])$(id).oninput=()=>{closeMenu();render();};
function clear(){closeMenu();rows=[];selected.clear();render();}
$('clear').onclick=clear;$('clear-menu').onclick=clear;
list.onclick=e=>{const node=e.target.closest('.packet');if(!node)return;const id=Number(node.dataset.id);if(e.ctrlKey||e.metaKey){selected.has(id)?selected.delete(id):selected.add(id);}else selected=new Set([id]);selection();list.focus({preventScroll:true});};
document.addEventListener('contextmenu',e=>{e.preventDefault();selectionText=window.getSelection()?.toString()||'';const node=e.target.closest('.packet');if(node&&!selected.has(Number(node.dataset.id)))selected=new Set([Number(node.dataset.id)]);selection();const hasPackets=visible.some(row=>selected.has(row.Id));$('copy-packet').disabled=$('copy-raw').disabled=!hasPackets;$('copy-selection').disabled=!selectionText;$('copy-all').disabled=!visible.length;menu.hidden=false;menu.style.left=Math.max(8,Math.min(e.clientX,innerWidth-menu.offsetWidth-8))+'px';menu.style.top=Math.max(8,Math.min(e.clientY,innerHeight-menu.offsetHeight-8))+'px';menu.querySelector('button:not(:disabled)')?.focus({preventScroll:true});});
document.addEventListener('pointerdown',e=>{if(!menu.contains(e.target))closeMenu();});
document.addEventListener('scroll',closeMenu,true);
menu.onmousedown=e=>e.preventDefault();
async function copy(text){closeMenu();try{if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(text);else throw Error('Clipboard API unavailable');}catch{const field=document.createElement('textarea');field.value=text;field.style.cssText='position:fixed;left:-10000px;top:0';document.body.append(field);field.select();const ok=document.execCommand('copy');field.remove();if(!ok){$('status').textContent='Copy failed. Select text and use Ctrl/⌘+C.';return;}}$('status').textContent='Copied to clipboard.';list.focus({preventScroll:true});}
function copyPackets(raw=false){return copy(visible.filter(e=>selected.has(e.Id)).map(e=>raw?e.Raw:tagged(e)).join('\n'));}
$('copy-packet').onclick=()=>copyPackets();$('copy-raw').onclick=()=>copyPackets(true);$('copy-selection').onclick=()=>copy(selectionText);$('copy-all').onclick=$('copy-visible').onclick=()=>copy(visible.map(tagged).join('\n'));
$('select-all').onclick=()=>{selected=new Set(visible.map(e=>e.Id));selection();closeMenu();list.focus();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();list.focus();return;}if(!menu.hidden&&['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();const items=Array.from(menu.querySelectorAll('button:not(:disabled)'));const index=items.indexOf(document.activeElement);items[(index+(e.key==='ArrowDown'?1:-1)+items.length)%items.length]?.focus();return;}if(e.target.closest('input,textarea'))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'){e.preventDefault();selected=new Set(visible.map(e=>e.Id));selection();}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='c'&&selected.size&&!window.getSelection()?.toString()){e.preventDefault();copyPackets();}});
async function poll(){try{const response=await fetch('/packets?since='+cursor);if(!response.ok)throw Error('Capture unavailable ('+response.status+').');const data=await response.json();$('file').textContent=data.file||'Packet logging is disabled.';cursor=data.cursor;if(data.entries.length)append(data.entries);if(menu.hidden)$('status').textContent='Capturing · '+cursor+' packets';}catch(error){$('status').textContent=error.message;}finally{setTimeout(poll,500);}}poll();
</script></html>
