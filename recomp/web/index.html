<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NosTale Recomp</title>
<style>
  :root { --bg: #101014; --fg: #d8d8e0; --muted: #8a8a96; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
  #login-panel { min-height: 100vh; display: grid; place-items: center; padding: 20px; box-sizing: border-box; }
  #login-panel[hidden], #game[hidden] { display: none; }
  .login-card { width: min(100%, 360px); padding: 28px; border: 1px solid #30303a; border-radius: 12px; background: #19191f; box-sizing: border-box; }
  .login-card h1 { margin: 0 0 6px; font-size: 22px; }
  .login-card p { margin: 0 0 20px; color: var(--muted); }
  .login-card label { display: block; margin: 14px 0; }
  .login-card [hidden] { display: none; }
  .login-card input, .login-card select { display: block; width: 100%; margin-top: 6px; padding: 10px; border: 1px solid #454550; border-radius: 6px; background: #101014; color: var(--fg); box-sizing: border-box; font: inherit; }
  .captcha-images { display: grid; grid-template-columns: 1fr; gap: 8px; margin: 12px 0; }
  .captcha-images img { display: block; max-width: 100%; max-height: 180px; margin: auto; object-fit: contain; background: white; }
  #captcha-prompt { min-height: 38px; padding: 6px 8px; border-radius: 4px; background: #252530; box-sizing: border-box; }
  .captcha-icon-strip { width: min(100%, 360px); margin: auto; }
  .captcha-icon-strip img { width: 100%; max-height: none; }
  .captcha-icon-numbers { display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; color: var(--fg); font-weight: 600; }
  .login-card button { width: 100%; margin-top: 8px; padding: 10px; border: 0; border-radius: 6px; background: #6652d8; color: white; font: inherit; font-weight: 600; cursor: pointer; }
  .login-card button:disabled { opacity: .6; cursor: wait; }
  #auth-error { min-height: 1.4em; margin-top: 12px; color: #ff9f9f; white-space: pre-wrap; }
  main { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; }
  canvas { max-width: 100%; height: auto; background: #000; image-rendering: auto; }
  #status { color: var(--muted); }
  #log { width: min(100%, 1100px); height: 180px; overflow: auto; background: #0a0a0d; color: var(--muted);
         font: 12px/1.35 ui-monospace, monospace; padding: 8px; box-sizing: border-box; white-space: pre-wrap; }
  #stage { position: relative; max-width: 100%; }
  .splash { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); max-width: 100%; pointer-events: none; }
  .msgbox { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgb(0 0 0 / 0.35); }
  .msgbox > div { min-width: 280px; max-width: 70%; background: #f0f0f0; color: #000; border: 1px solid #888;
                  box-shadow: 0 6px 24px rgb(0 0 0 / 0.5); font: 13px/1.4 Tahoma, system-ui, sans-serif; }
  .msgbox h1 { margin: 0; padding: 6px 10px; font: inherit; font-weight: 600; background: #fff; border-bottom: 1px solid #ddd; }
  .msgbox p { margin: 0; padding: 16px 14px; white-space: pre-wrap; }
  .msgbox footer { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 14px; background: #e6e6e6; }
  .msgbox button { min-width: 76px; padding: 3px 10px; font: inherit; }
  .notice { position: absolute; top: 8px; right: 8px; z-index: 5; max-width: 420px; padding: 8px 28px 8px 10px; background: rgb(20 20 26 / 0.9);
            color: #e8e8f0; border-left: 3px solid #d9a441; font: 12px/1.4 system-ui, sans-serif; white-space: pre-wrap; cursor: pointer; }
  .notice b { display: block; margin-bottom: 2px; }
  .notice::after { content: '\00D7'; position: absolute; top: 4px; right: 8px; color: #9a9aa6; }
  .menu { position: absolute; z-index: 10; min-width: 160px; padding: 3px 0; margin: 0; list-style: none; background: #f2f2f2;
          color: #000; border: 1px solid #999; box-shadow: 2px 3px 8px rgb(0 0 0 / 0.4); font: 13px/1.6 Tahoma, system-ui, sans-serif; }
  .menu li { position: relative; display: flex; gap: 24px; padding: 0 22px 0 24px; white-space: nowrap; cursor: default; }
  .menu li:hover:not(.off):not(.sep) { background: #3875d7; color: #fff; }
  .menu li.off { color: #8a8a8a; }
  .menu li.sep { height: 1px; margin: 3px 2px; padding: 0; background: #ccc; }
  .menu li.default { font-weight: 600; }
  .menu li .mark { position: absolute; left: 8px; }
  .menu li .acc { margin-left: auto; }
  .menu li.sub::after { content: '\25B8'; position: absolute; right: 8px; }
</style>
</head>
<body>
<section id="login-panel">
  <div class="login-card">
    <h1>Sign in to Gameforge</h1>
    <p>Your credentials are sent to Gameforge through the local ClientLab server.</p>
    <form id="auth-form">
      <label>Email<input id="auth-email" type="email" autocomplete="username" required></label>
      <label>Password<input id="auth-password" type="password" autocomplete="current-password" required></label>
      <label id="otp-label" hidden>Authenticator code<input id="otp-code" inputmode="numeric" autocomplete="one-time-code"></label>
      <div id="captcha-panel" hidden>
        <p id="captcha-instructions">Read the instruction strip, match the requested item to the target, then enter the number beneath the matching icon.</p>
        <div class="captcha-images">
          <img id="captcha-prompt" alt="Gameforge challenge instructions">
          <div class="captcha-icon-strip">
            <img id="captcha-icons" alt="Four items to choose from, numbered left to right below">
            <div class="captcha-icon-numbers" aria-hidden="true"><span>1</span><span>2</span><span>3</span><span>4</span></div>
          </div>
          <img id="captcha-target" alt="Item to match">
        </div>
        <label>Icon number<input id="captcha-answer" type="number" min="1" max="4" step="1" inputmode="numeric"></label>
      </div>
      <label id="account-label" hidden>Choose your NosTale game account<select id="game-account"></select></label>
      <button id="auth-submit" type="submit">Sign in</button>
      <div id="auth-error" role="status" aria-live="polite"></div>
    </form>
  </div>
</section>
<main id="game" hidden>
  <div id="stage"><canvas id="screen" width="1024" height="768" tabindex="0"></canvas></div>
  <div id="status">starting…</div>
  <div id="log"></div>
</main>
<script src="https://gameforge.com/tra/game1.js"></script>
<script>
  const canvas = document.getElementById('screen');
  // The software renderer sends pixels (2D context); WebGL sends bitmaps, which a bitmaprenderer takes without a copy.
  let ctx = null, bitmaps = null;
  const status = document.getElementById('status');
  const log = document.getElementById('log');
  let worker = null;
  let frames = 0, last = performance.now();
  // Appending to textContent per line is quadratic; lines are batched per frame and the pane keeps the last 1000.
  const LOG_LINES = 1000;
  let lines = [], pending = [], flushQueued = false;
  window.allLog = [];
  function flushLog() {
    flushQueued = false;
    lines = lines.concat(pending);
    pending = [];
    if (lines.length > LOG_LINES) lines = lines.slice(-LOG_LINES);
    log.textContent = lines.join('\n');
    log.scrollTop = log.scrollHeight;
  }
  // WebGL frames are shown one per display refresh from a queue of at most two, so a frame that comes a little late
  // still has one ready behind it instead of the refresh repeating the last frame. shownCount[0] counts the frames
  // shown; the worker reads it to stay at most two frames ahead (js_gl_present in render_gl.inc).
  window.frameStats = { refreshes: 0, shown: 0, repeated: 0, overwritten: 0 };
  const queued = [];
  let shownCount = null;
  function showFrame() {
    const f = window.frameStats, bmp = queued.shift();
    f.refreshes++;
    if (bmp) {
      if (canvas.width !== bmp.width || canvas.height !== bmp.height) { canvas.width = bmp.width; canvas.height = bmp.height; }
      bitmaps = bitmaps || canvas.getContext('bitmaprenderer');
      bitmaps.transferFromImageBitmap(bmp);
      f.shown++;
      frames++;
      Atomics.add(shownCount, 0, 1);
      Atomics.notify(shownCount, 0);
      const now = performance.now();
      if (now - last > 1000) { status.textContent = `${canvas.width}x${canvas.height}, ${frames} frames/s shown (WebGL)`; frames = 0; last = now; }
    } else if (f.shown) f.repeated++;
    requestAnimationFrame(showFrame);
  }
  function handleWorkerMessage(e) {
    const m = e.data;
    if (m.type === 'frame') {
      if (canvas.width !== m.w || canvas.height !== m.h) { canvas.width = m.w; canvas.height = m.h; }
      ctx = ctx || canvas.getContext('2d');
      ctx.putImageData(new ImageData(new Uint8ClampedArray(m.data.buffer), m.w, m.h), 0, 0);
      frames++;
      const now = performance.now();
      if (now - last > 1000) { status.textContent = `${m.w}x${m.h}, ${frames} frames/s shown`; frames = 0; last = now; }
    } else if (m.type === 'bitmap') {
      queued.push(m.bmp);
      while (queued.length > 2) { queued.shift().close(); window.frameStats.overwritten++; }
    } else if (m.type === 'log') {
      pending.push(m.text);
      window.allLog.push(m.text);
      if (!flushQueued) { flushQueued = true; requestAnimationFrame(flushLog); }
    } else if (m.type === 'input') {
      ring = m.ring;
      audioDone = m.audioDone;
      pasteBuf = m.paste;
      shownCount = m.vsync;
      requestAnimationFrame(showFrame);
    } else if (m.type === 'cursor') {
      if (!m.visible) canvas.style.cursor = 'none';
      else if (!m.rgba) canvas.style.cursor = 'default';
      else {
        const cv = document.createElement('canvas');
        cv.width = m.w; cv.height = m.h;
        cv.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(m.rgba.buffer), m.w, m.h), 0, 0);
        canvas.style.cursor = `url(${cv.toDataURL()}) ${m.hx} ${m.hy}, default`;
      }
    } else if (m.type === 'modal') {
      (m.kind === 'msgbox' ? messageBox : popupMenu)(m.data, (v) => {
        Atomics.store(m.reply, 1, v);
        Atomics.store(m.reply, 0, 1);
        Atomics.notify(m.reply, 0);
        canvas.focus();
      });
    } else if (m.type === 'clipboard') {
      navigator.clipboard?.writeText(m.text).catch(() => { });
    } else if (m.type === 'open-url') {
      window.open(m.url, '_blank', 'noopener');
    } else if (m.type === 'sound') {
      sound(m);
    } else if (m.type === 'splash') {
      splash(m.bytes);
    } else if (m.type === 'net-open') {
      netOpen(m.id, m.ring);
    } else if (m.type === 'net-send') {
      const c = nets.get(m.id);
      if (c) c.sends = c.sends.then(() => fetch(`/net/send?id=${m.id}`, { method: 'POST', body: m.bytes })).catch(() => { });
    } else if (m.type === 'net-close') {
      const c = nets.get(m.id);
      if (c) { c.open = false; nets.delete(m.id); c.sends.then(() => fetch(`/net/close?id=${m.id}`, { method: 'POST' })); }
    }
  }

  function startGame(code, installationId = undefined) {
    const params = new URLSearchParams(location.search);
    if (code) params.set('auth', code);
    if (installationId) params.set('NC_INSTALLATION_ID', installationId);
    worker = new Worker('/worker.js' + (params.size ? `?${params}` : ''));
    worker.onmessage = handleWorkerMessage;
  }

  // Relayed sockets (hle_misc.c): the page long-polls the dev server and fills the worker's ring, so the worker
  // never blocks on the network.
  const nets = new Map();
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  function netOpen(id, ring) {
    const hdr = new Int32Array(ring, 0, 4), data = new Uint8Array(ring, 16), size = data.length;
    const conn = { open: true, sends: Promise.resolve() };
    nets.set(id, conn);
    (async () => {
      while (conn.open) {
        let r;
        try { r = await fetch(`/net/recv?id=${id}&wait=1`); } catch { await sleep(100); continue; }
        if (r.status === 410 || r.status === 404) break;
        const bytes = new Uint8Array(await r.arrayBuffer());
        for (let off = 0; off < bytes.length;) {
          const written = Atomics.load(hdr, 0), free = size - (written - Atomics.load(hdr, 1));
          if (free <= 0) { await sleep(5); continue; }
          const n = Math.min(free, bytes.length - off), at = written % size, first = Math.min(n, size - at);
          data.set(bytes.subarray(off, off + first), at);
          if (n > first) data.set(bytes.subarray(off + first, off + n), 0);
          Atomics.store(hdr, 0, written + n);
          off += n;
        }
      }
      Atomics.store(hdr, 2, 1);
    })();
  }

  // Miles samples (hle_audio.c). Browsers only start audio after a user gesture, so the context resumes on the first
  // click or key press; decoded buffers are cached by content.
  let audio = null, audioDone = null;
  window.soundStats = { played: 0, undecodable: 0 };
  const voices = new Map(), decoded = new Map();
  function audioContext() {
    if (!audio) audio = new AudioContext();
    return audio;
  }
  for (const ev of ['mousedown', 'keydown']) canvas.addEventListener(ev, () => audioContext().resume(), { capture: true });
  function soundKey(bytes) {
    let h = bytes.length;
    for (let i = 0; i < bytes.length; i += Math.max(1, bytes.length >> 6)) h = (h * 31 + bytes[i]) | 0;
    return h;
  }
  function stopVoice(id) {
    const v = voices.get(id);
    if (!v) return;
    voices.delete(id);
    v.source.onended = null;
    try { v.source.stop(); } catch { }
  }
  // MessageBeep: kind 0 is the plain beep, then MB_OK, MB_ICONHAND, MB_ICONQUESTION, MB_ICONEXCLAMATION, MB_ICONASTERISK.
  function beep(kind) {
    const ctx = audioContext(), osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.frequency.value = [750, 660, 440, 587, 523, 880][kind] ?? 660;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.2);
  }
  async function sound(m) {
    const ctx = audioContext();
    if (m.op === 'beep') { beep(m.kind); return; }
    if (m.op === 'stop') { stopVoice(m.id); return; }
    if (m.op === 'volume') {
      const v = voices.get(m.id);
      if (v) { v.gain.gain.value = m.volume; v.panner.pan.value = m.pan * 2 - 1; v.source.playbackRate.value = m.rate; }
      return;
    }
    stopVoice(m.id);
    const key = soundKey(m.bytes);
    let buffer = decoded.get(key);
    if (!buffer) {
      try { buffer = await ctx.decodeAudioData(m.bytes.buffer); } catch { buffer = null; }
      if (!buffer) { window.soundStats.undecodable++; if (audioDone) Atomics.store(audioDone, m.id, m.generation); return; }
      decoded.set(key, buffer);
    }
    const source = ctx.createBufferSource(), gain = ctx.createGain(), panner = ctx.createStereoPanner();
    source.buffer = buffer;
    source.loop = m.loops === 0;
    source.playbackRate.value = m.rate;
    gain.gain.value = m.volume;
    panner.pan.value = m.pan * 2 - 1;
    source.connect(gain).connect(panner).connect(ctx.destination);
    let left = m.loops > 1 ? m.loops - 1 : 0;
    source.onended = () => {
      if (voices.get(m.id)?.source !== source) return;
      voices.delete(m.id);
      if (audioDone) Atomics.store(audioDone, m.id, m.generation);
    };
    if (left > 0) { source.loop = true; setTimeout(() => { source.loop = false; }, buffer.duration * 1000 * left / m.rate); }
    voices.set(m.id, { source, gain, panner });
    window.soundStats.played++;
    source.start();
  }

  // The loading splash (ewsf.ews in hle_misc.c), centred over the screen until the client frees it.
  let splashImg = null;
  function splash(bytes) {
    if (splashImg) { URL.revokeObjectURL(splashImg.src); splashImg.remove(); splashImg = null; }
    if (!bytes) return;
    splashImg = document.getElementById('stage').appendChild(document.createElement('img'));
    splashImg.className = 'splash';
    splashImg.alt = '';
    splashImg.src = URL.createObjectURL(new Blob([bytes], { type: 'image/jpeg' }));
  }

  // Message boxes and popup menus (hle_user32.c, hle_menu.c): the worker waits on the reply while its timers keep running.
  // ?autodismiss answers them at once with the default button, for unattended runs.
  const stage = document.getElementById('stage');
  const autoDismiss = new URLSearchParams(location.search).has('autodismiss');
  const BUTTON = { 1: 'OK', 2: 'Cancel', 3: 'Abort', 4: 'Retry', 5: 'Ignore', 6: 'Yes', 7: 'No', 10: 'Try Again', 11: 'Continue' };
  function messageBox(d, done) {
    const fallback = d.buttons[d.default < d.buttons.length ? d.default : 0];
    if (autoDismiss) { window.allLog.push(`message box "${d.caption}" dismissed with ${BUTTON[fallback]}: ${d.text}`); done(fallback); return; }
    // A box with a single button has only one possible answer, so the game is not held up: the text stays visible as
    // a notice instead.
    if (d.buttons.length === 1) {
      const note = stage.appendChild(document.createElement('div'));
      note.className = 'notice';
      note.title = 'Dismiss';
      note.appendChild(document.createElement('b')).textContent = d.caption;
      note.append(d.text);
      note.onclick = () => note.remove();
      setTimeout(() => note.remove(), 15000);
      done(fallback);
      return;
    }
    const box = document.createElement('div');
    box.className = 'msgbox';
    const panel = box.appendChild(document.createElement('div'));
    panel.setAttribute('role', 'alertdialog');
    panel.appendChild(document.createElement('h1')).textContent = d.caption;
    panel.appendChild(document.createElement('p')).textContent = d.text;
    const footer = panel.appendChild(document.createElement('footer'));
    const finish = (v) => { box.remove(); done(v); };
    let focus = null;
    for (const id of d.buttons) {
      const b = footer.appendChild(document.createElement('button'));
      b.textContent = BUTTON[id];
      b.onclick = () => finish(id);
      if (id === fallback) focus = b;
    }
    box.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && (d.buttons.includes(2) || d.buttons.length === 1)) finish(d.buttons.includes(2) ? 2 : d.buttons[0]);
      e.stopPropagation();
    });
    stage.appendChild(box);
    focus?.focus();
  }
  function addSpan(li, cls, text) {
    const span = li.appendChild(document.createElement('span'));
    span.className = cls;
    span.textContent = text;
  }
  function menuLabel(li, text) {
    const [label, acc] = text.split('\t');
    const span = li.appendChild(document.createElement('span'));
    for (let i = 0; i < label.length; i++) {
      if (label[i] === '&' && i + 1 < label.length) {
        i++;
        if (label[i] === '&') span.append('&');
        else span.appendChild(document.createElement('u')).textContent = label[i];
      } else span.append(label[i]);
    }
    if (acc) addSpan(li, 'acc', acc);
  }
  function popupMenu(d, done) {
    if (autoDismiss) { window.allLog.push('popup menu dismissed'); done(0); return; }
    const scale = stage.getBoundingClientRect().width / canvas.width;
    const open = [];
    const close = (v) => { for (const ul of open) ul.remove(); document.removeEventListener('mousedown', outside, true); done(v); };
    const outside = (e) => { if (!open.some((ul) => ul.contains(e.target))) close(0); };
    function build(items, x, y, level) {
      while (open.length > level) open.pop().remove();
      const ul = stage.appendChild(document.createElement('ul'));
      ul.className = 'menu';
      ul.style.left = `${x}px`;
      ul.style.top = `${y}px`;
      open.push(ul);
      for (const it of items) {
        const li = ul.appendChild(document.createElement('li'));
        if (it.separator) { li.className = 'sep'; continue; }
        if (it.disabled) li.classList.add('off');
        if (it.default) li.classList.add('default');
        if (it.sub) li.classList.add('sub');
        if (it.checked) addSpan(li, 'mark', it.radio ? '\u2022' : '\u2713');
        menuLabel(li, it.text);
        li.onmouseenter = () => {
          if (it.sub && !it.disabled) build(it.sub, ul.offsetLeft + ul.offsetWidth - 3, ul.offsetTop + li.offsetTop - 3, level + 1);
          else while (open.length > level + 1) open.pop().remove();
        };
        li.onclick = () => { if (!it.disabled && !it.sub) close(it.id); };
      }
      const r = stage.getBoundingClientRect(), u = ul.getBoundingClientRect();
      if (u.right > r.right) ul.style.left = `${Math.max(0, x - u.width)}px`;
      if (u.bottom > r.bottom) ul.style.top = `${Math.max(0, y - u.height)}px`;
    }
    build(d.items, d.x * scale, d.y * scale, 0);
    document.addEventListener('mousedown', outside, true);
    open[0].tabIndex = -1;
    open[0].focus();
    open[0].addEventListener('keydown', (e) => { if (e.key === 'Escape') close(0); e.stopPropagation(); });
  }

  // Ctrl+V is held back until the browser's paste event has put the text where the clipboard functions read it.
  let pasteBuf = null, pendingPaste = null;
  document.addEventListener('paste', (e) => {
    const text = e.clipboardData?.getData('text') ?? '';
    if (pasteBuf) {
      const n = Math.min(text.length, 65536), chars = new Uint16Array(pasteBuf.buffer, 8, n);
      for (let i = 0; i < n; i++) chars[i] = text.charCodeAt(i);
      Atomics.store(pasteBuf, 1, n);
      Atomics.add(pasteBuf, 0, 1);
    }
    if (pendingPaste) { pendingPaste(); pendingPaste = null; }
  });

  // Same event codes as pump_input in hle_user32.c.
  const IN = { move: 1, down: 2, up: 3, wheel: 4, keydown: 5, keyup: 6, char: 7, dumpFrame: 8 };
  let ring = null;
  function send(type, a, x = 0, y = 0) {
    if (!ring) return;
    const head = Atomics.load(ring, 0), cap = (ring.length - 2) >> 2;
    if (head - Atomics.load(ring, 1) >= cap) return;
    const at = 2 + (head % cap) * 4;
    ring[at] = type; ring[at + 1] = a; ring[at + 2] = x; ring[at + 3] = y;
    Atomics.store(ring, 0, head + 1);
    Atomics.notify(ring, 0);
  }
  function pos(e) {
    const r = canvas.getBoundingClientRect();
    return [Math.round((e.clientX - r.left) * canvas.width / r.width), Math.round((e.clientY - r.top) * canvas.height / r.height)];
  }
  canvas.addEventListener('mousemove', (e) => send(IN.move, 0, ...pos(e)));
  canvas.addEventListener('mousedown', (e) => { canvas.focus(); send(IN.down, e.button, ...pos(e)); e.preventDefault(); });
  canvas.addEventListener('mouseup', (e) => send(IN.up, e.button, ...pos(e)));
  canvas.addEventListener('wheel', (e) => { send(IN.wheel, e.deltaY < 0 ? 120 : -120, ...pos(e)); e.preventDefault(); }, { passive: false });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  const charKeys = { Enter: 13, Backspace: 8, Tab: 9, Escape: 27 };
  // The character a key produces, as TranslateMessage would make it: Ctrl+letter is a control code, AltGr (Ctrl+Alt)
  // keeps the layout's character.
  function keyChar(e) {
    if (e.key.length !== 1) return charKeys[e.key];
    const code = e.key.charCodeAt(0);
    if (e.ctrlKey && !e.altKey) return /^[a-z@[\\\]^_]$/i.test(e.key) ? code & 0x1f : undefined;
    return code;
  }
  canvas.addEventListener('keydown', (e) => {
    // F9 is not a game key: it asks the renderer to log every draw of the next frame.
    if (e.key === 'F9') { send(IN.dumpFrame, 0); e.preventDefault(); return; }
    const press = () => {
      send(IN.keydown, e.keyCode);
      const ch = keyChar(e);
      if (ch !== undefined) send(IN.char, ch);
    };
    if (e.ctrlKey && !e.altKey && e.keyCode === 86) {
      pendingPaste = press;
      setTimeout(() => { if (pendingPaste === press) { pendingPaste = null; press(); } }, 100);
      return;
    }
    press();
    e.preventDefault();
  });
  canvas.addEventListener('keyup', (e) => { send(IN.keyup, e.keyCode); e.preventDefault(); });

  const loginPanel = document.getElementById('login-panel');
  const game = document.getElementById('game');
  const authForm = document.getElementById('auth-form');
  const authEmail = document.getElementById('auth-email');
  const authPassword = document.getElementById('auth-password');
  const otpLabel = document.getElementById('otp-label');
  const otpCode = document.getElementById('otp-code');
  const captchaPanel = document.getElementById('captcha-panel');
  const captchaInstructions = document.getElementById('captcha-instructions');
  const captchaPrompt = document.getElementById('captcha-prompt');
  const captchaIcons = document.getElementById('captcha-icons');
  const captchaTarget = document.getElementById('captcha-target');
  const captchaAnswer = document.getElementById('captcha-answer');
  const accountLabel = document.getElementById('account-label');
  const gameAccount = document.getElementById('game-account');
  const authSubmit = document.getElementById('auth-submit');
  const authError = document.getElementById('auth-error');
  let authSessionId = null;
  let authFlowId = null;
  let authChallengeType = null;

  async function authRequest(path, payload) {
    const response = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || `Authentication failed (${response.status})`);
    return result;
  }
  function createGameforgeBlackbox(request = undefined) {
    return new Promise((resolve, reject) => {
      if (typeof game1 !== 'function') {
        reject(new Error('Gameforge identity script did not load. Check the connection and retry.'));
        return;
      }
      const timeout = setTimeout(() => reject(new Error('Gameforge identity collection timed out.')), 15000);
      const done = (value) => { clearTimeout(timeout); resolve(`tra:${value}`); };
      try {
        if (request === undefined) game1(done);
        else game1(done, request);
      } catch (error) {
        clearTimeout(timeout);
        reject(error);
      }
    });
  }
  function showChallenge(result) {
    authFlowId = result.flowId;
    authChallengeType = result.challenge;
    accountLabel.hidden = true;
    authPassword.required = false;
    otpLabel.hidden = result.challenge !== 'otp';
    captchaPanel.hidden = result.challenge !== 'captcha';
    otpCode.required = result.challenge === 'otp';
    captchaAnswer.required = result.challenge === 'captcha';
    if (result.challenge === 'otp') {
      otpCode.value = '';
      authSubmit.textContent = 'Verify code';
      authError.textContent = result.message || 'Enter the one-time code from your authenticator.';
      otpCode.focus();
    } else {
      captchaPrompt.src = result.images.prompt;
      captchaIcons.src = result.images.icons;
      captchaTarget.src = result.images.target;
      captchaAnswer.value = '';
      authSubmit.textContent = 'Submit captcha answer';
      authError.textContent = result.message || '';
      captchaAnswer.focus();
    }
  }
  function showAccounts(result) {
    authFlowId = null;
    authChallengeType = null;
    otpLabel.hidden = true;
    captchaPanel.hidden = true;
    otpCode.required = false;
    captchaAnswer.required = false;
    authSessionId = result.sessionId;
    gameAccount.replaceChildren(...result.accounts.map((account) => {
      const option = document.createElement('option');
      option.value = account.id;
      option.textContent = `${account.name} (${account.id})`;
      return option;
    }));
    accountLabel.hidden = false;
    authSubmit.textContent = 'Continue';
  }
  async function requestGameforgeLaunchCode() {
    const iovationBlackbox = await createGameforgeBlackbox();
    const launch = await authRequest('/auth/launch', {
      sessionId: authSessionId,
      accountId: gameAccount.value,
      iovationBlackbox
    });
    const codeBlackbox = await createGameforgeBlackbox(launch.blackboxRequest);
    return authRequest('/auth/launch-code', {
      sessionId: authSessionId,
      accountId: gameAccount.value,
      gsid: launch.gsid,
      codeBlackbox
    });
  }
  async function launchGame(result) {
    authSessionId = null;
    authPassword.required = true;
    authPassword.value = '';
    loginPanel.hidden = true;
    game.hidden = false;
    startGame(result.code, result.installationId);
  }
  authForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    authSubmit.disabled = true;
    authError.textContent = '';
    try {
      if (authSessionId) {
        const launched = await requestGameforgeLaunchCode();
        await launchGame(launched);
      } else if (authFlowId) {
        const payload = { flowId: authFlowId, blackbox: await createGameforgeBlackbox() };
        if (authChallengeType === 'otp') payload.otpCode = otpCode.value;
        else payload.answer = Number(captchaAnswer.value) - 1;
        const result = await authRequest('/auth/challenge', payload);
        if (result.challenge) showChallenge(result);
        else showAccounts(result);
      } else {
        const blackbox = await createGameforgeBlackbox();
        const result = await authRequest('/auth/login', { email: authEmail.value, password: authPassword.value, blackbox });
        authPassword.value = '';
        authPassword.required = false;
        if (result.challenge) showChallenge(result);
        else showAccounts(result);
      }
    } catch (error) {
      if (authSessionId && error.message !== 'Sign-in expired. Please sign in again.') {
        authError.textContent = error.message;
        authSubmit.textContent = 'Retry launch code';
      } else {
        authSessionId = null;
        authFlowId = null;
        authChallengeType = null;
        authPassword.required = true;
        authPassword.value = '';
        otpLabel.hidden = true;
        captchaPanel.hidden = true;
        accountLabel.hidden = true;
        otpCode.required = false;
        captchaAnswer.required = false;
        authSubmit.textContent = 'Sign in';
        authError.textContent = error.message;
      }
    } finally {
      authSubmit.disabled = false;
    }
  });

  const authFromUrl = new URLSearchParams(location.search).get('auth');
  if (authFromUrl) {
    loginPanel.hidden = true;
    game.hidden = false;
    startGame(authFromUrl);
  }
</script>
</body>
</html>
